version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: metaverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for WebSocket sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTP API Service
  http-api:
    build:
      context: .
      dockerfile: apps/http/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/metaverse?schema=public
      JWT_SECRET: your-jwt-secret-here
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # WebSocket Service
  ws-server:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/metaverse?schema=public
      JWT_SECRET: your-jwt-secret-here
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - http-api
      - ws-server

volumes:
  postgres_data:
  redis_data: 