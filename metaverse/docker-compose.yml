version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: metaverse-postgres
    environment:
      POSTGRES_DB: metaverse
      POSTGRES_USER: metaverse_user
      POSTGRES_PASSWORD: metaverse_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/prisma/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaverse_user -d metaverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for WebSocket sessions (if needed)
  redis:
    image: redis:7-alpine
    container_name: metaverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTP API Server
  http-api:
    build:
      context: .
      dockerfile: Dockerfile.http
    container_name: metaverse-http-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://metaverse_user:metaverse_password@postgres:5432/metaverse
      - JWT_PASSWORD=123kasdk123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # WebSocket Server
  ws-server:
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: metaverse-ws-server
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://metaverse_user:metaverse_password@postgres:5432/metaverse
      - JWT_PASSWORD=123kasdk123
      - REDIS_URL=redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: metaverse-frontend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - http-api
      - ws-server
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: metaverse-network 