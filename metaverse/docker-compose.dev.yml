version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: metaverse-postgres-dev
    environment:
      POSTGRES_DB: metaverse
      POSTGRES_USER: metaverse_user
      POSTGRES_PASSWORD: metaverse_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaverse_user -d metaverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for WebSocket sessions
  redis:
    image: redis:7-alpine
    container_name: metaverse-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  default:
    name: metaverse-dev-network 