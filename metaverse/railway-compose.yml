version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: metaverse
      POSTGRES_USER: metaverse_user
      POSTGRES_PASSWORD: metaverse_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaverse_user -d metaverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTP API Server
  http-api:
    build:
      context: ./metaverse
      dockerfile: Dockerfile.http
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://metaverse_user:metaverse_password@postgres:5432/metaverse
      - JWT_PASSWORD=123kasdk123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # WebSocket Server
  ws-server:
    build:
      context: ./metaverse
      dockerfile: Dockerfile.ws
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://metaverse_user:metaverse_password@postgres:5432/metaverse
      - JWT_PASSWORD=123kasdk123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./metaverse
      dockerfile: Dockerfile.frontend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    depends_on:
      - http-api
      - ws-server
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local 